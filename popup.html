<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chess Monk</title>
    <link rel="stylesheet" href="style.css">
    <script src="popup.js" defer></script>
</head>
<body>


 <div class="switchdiv">
    
    <h1>Focus Mode</h1>

    <label class="switch">
        <input type="checkbox" id="switchbtn">
        <span class="slider"></span>
    </label>
</div>

 <div class="switchdiv2">
    
    <h1>Blur Mode</h1>

    <label class="switch2">
        <input type="checkbox" id="switchbtn2">
        <span class="slider2"></span>
    </label>
</div>

<div class="switchdiv3">
    
    <h1>Opponent's info</h1>

    <label class="switch3">
        <input type="checkbox" id="switchbtn3">
        <span class="slider3"></span>
    </label>
</div>

</body>
</html>
